<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#0f0f0f" />
		<title>list</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				background: #0f0f0f;
				font-family: "Fira Code", monospace;
				min-height: 100dvh;
				overflow: hidden; /* prevent whole page scroll */
				display: flex;
				flex-direction: column;
				padding-top: env(safe-area-inset-top);
				padding-bottom: env(safe-area-inset-bottom);
				overscroll-behavior: none;
			}

			/* ── Sticky input at top ── */
			#form {
				position: sticky;
				top: 0;
				background: #0f0f0f;
				padding: 1rem 0.5rem;
				z-index: 10;
				display: flex;
				justify-content: center;
				/*border-bottom: 1px solid #313244;*/
				flex-shrink: 0;
			}

			#input {
				background: transparent;
				border: none;
				outline: none;
				font-size: 1.5rem;
				color: #cdd6f4;
				caret-color: #89b4fa;
				text-align: center;
				width: 100%;
				max-width: 600px;
				padding: 0.5rem;
			}
			/* ── Scrollable list ── */
			#list-container {
				flex: 1;
				overflow-y: auto;
				padding: 1rem 0.5rem;
				display: flex;
				flex-direction: column;
				align-items: center;
			}

			#list {
				list-style: none;
				color: #a6e3a1;
				font-size: 1.1rem;
				text-align: center;
				width: 100%;
				max-width: 600px;
			}

			#list li {
				padding: 0.3rem 0;
			}
			#list li.highlight {
				color: #fffafa;
				/*background: #313244;*/
				border-radius: 0.4rem;
			}

			#list-container {
				overflow-y: auto;
				-webkit-overflow-scrolling: touch;
				scroll-behavior: smooth;
			}

			/* Desktop: larger type */
			@media (min-width: 641px) {
				#input { font-size: 2rem; }
				#list { font-size: 1.5rem; }
			}

			#winner-screen {
				position: fixed;
				inset: 0;
				background: #000;
				display: flex;
				align-items: center;
				justify-content: center;
				color: #a6e3a1;
				font-size: 3rem;
				text-align: center;
				padding: 2rem;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.6s ease;
				z-index: 100;
			}
			#winner-screen.show {
				opacity: 1;
				pointer-events: auto;
			}

			#buttons-container {
				display: flex;
				justify-content: center;
				padding: 1rem 0.5rem calc(1rem + env(safe-area-inset-bottom));
				flex-shrink: 0;
			}
			#ROLL_DA_THANG {
				min-height: 44px;
				min-width: 44px;
				padding: 0.5rem 1.5rem;
				font: inherit;
				border: 1px solid #a6e3a1;
				background: transparent;
				color: #a6e3a1;
				border-radius: 0.4rem;
				cursor: pointer;
			}
			#ROLL_DA_THANG:hover { background: #a6e3a1; color: #0f0f0f; }
		</style>
	</head>
	<body>
		<div id="winner-screen"></div>

		<form id="form">
			<input id="input" type="text" spellcheck="false" autocomplete="off" />
		</form>

		<div id="list-container">
			<ul id="list"></ul>
		</div>

		<div id="buttons-container">
			<button id="ROLL_DA_THANG">spin</button>
		</div>

		<script>
			const form = document.getElementById("form");
			const input = document.getElementById("input");
			const list = document.getElementById("list");
			const spin_btn = document.getElementById("ROLL_DA_THANG");
			const winnerScreen = document.getElementById("winner-screen");

			// Touch devices: skip autofocus so the keyboard doesn't pop up on load
			const isTouch = matchMedia("(hover: none) and (pointer: coarse)").matches;
			if (!isTouch) input.focus();

			// ── Global type‑anywhere capture ──
			document.addEventListener("keydown", (e) => {
				if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
					if (document.activeElement !== input) {
						input.focus();
						input.value += e.key;
						input.dispatchEvent(new Event("input", { bubbles: true }));
						e.preventDefault();
					}
				}
			});

			// Click anywhere → focus input (desktop only; on touch it would pop the keyboard)
			if (!isTouch) {
				document.addEventListener("click", () => input.focus());
			}

			let tasks = [];
			try {
				tasks = JSON.parse(localStorage.getItem("tasks")) || [];
				if (!Array.isArray(tasks)) tasks = [];
			} catch {
				tasks = [];
			}

			function saveTasks() {
				localStorage.setItem("tasks", JSON.stringify(tasks));
			}

			function renderTasks() {
				list.innerHTML = "";
				for (const t of tasks) {
					const li = document.createElement("li");
					li.textContent = t;
					list.appendChild(li);
				}
			}

			// On form submit:
			form.addEventListener("submit", (e) => {
				e.preventDefault();
				const text = input.value.trim();
				if (text) {
					tasks.unshift(text); // add to top
					saveTasks();
					renderTasks();
					input.value = "";
				}
			});

			function showWinner(task, onDismiss) {
				winnerScreen.textContent = task;
				winnerScreen.classList.add("show");

				// click to dismiss
				winnerScreen.addEventListener("click", function hide() {
					winnerScreen.classList.remove("show");
					winnerScreen.removeEventListener("click", hide);
					onDismiss?.();
				});
			}

			// Spinnger
			spin_btn.addEventListener("click", () => {
				if (!tasks.length) return;

				const winnerIndex = Math.floor(Math.random() * tasks.length);
				let index = 0;
				let speed = 50; // ms per tick
				let ticks = 0;
				const minTicks =
					tasks.length * 3 + Math.floor(Math.random() * tasks.length);

				function tick() {
					// remove old highlight
					list.querySelector(".highlight")?.classList.remove("highlight");
					// add highlight to current item
					list.children[index % tasks.length].classList.add("highlight");

					if (ticks >= minTicks) {
						// force landing on winner
						if (index % tasks.length === winnerIndex) {
							const winner = tasks[winnerIndex];
							tasks.splice(winnerIndex, 1);
							saveTasks();
							showWinner(winner, renderTasks);
							return;
						}
						speed += 40;
					}

					setTimeout(tick, speed);

					index++;
					ticks++;
				}

				tick();
			});

			// On page load:
			renderTasks();
		</script>
	</body>
</html>
