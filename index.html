<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#0f0f0f" />
		<title>jusdoit</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			[hidden] {
				display: none !important;
			}

			body {
				background: #0f0f0f;
				font-family: "Fira Code", monospace;
				height: 100vh;
				height: 100dvh;
				min-height: 0;
				overflow: hidden;
				display: flex;
				flex-direction: column;
				padding-top: env(safe-area-inset-top);
				padding-bottom: env(safe-area-inset-bottom);
				overscroll-behavior: none;
			}

			button {
				font-family: inherit;
			}

			#boot {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
				color: #6c7086;
			}

			/* ── Auth ── */
			#auth-screen {
				flex: 1;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				gap: 1.25rem;
				padding: 2rem 1rem;
				width: 100%;
				max-width: 360px;
				margin: 0 auto;
			}

			#auth-screen h1 {
				font-size: 2rem;
				font-weight: 500;
				color: #a6e3a1;
				letter-spacing: 0.04em;
			}

			#auth-form {
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
				width: 100%;
			}

			.field {
				background: #161616;
				border: 1px solid #2a2a2a;
				border-radius: 0.4rem;
				color: #cdd6f4;
				font: inherit;
				font-size: 1rem;
				padding: 0.75rem;
				outline: none;
				width: 100%;
			}

			.field:focus {
				border-color: #89b4fa;
			}

			.primary {
				min-height: 44px;
				background: #a6e3a1;
				border: none;
				border-radius: 0.4rem;
				color: #0f0f0f;
				font: inherit;
				font-size: 1rem;
				font-weight: 600;
				cursor: pointer;
				padding: 0 1rem;
			}

			.primary:disabled {
				opacity: 0.5;
				cursor: wait;
			}

			#auth-error {
				color: #f38ba8;
				font-size: 0.9rem;
				min-height: 1.2em;
				text-align: center;
			}

			#auth-toggle {
				background: none;
				border: none;
				color: #89b4fa;
				font: inherit;
				font-size: 0.9rem;
				cursor: pointer;
			}

			/* ── Shell ── */
			#app {
				flex: 1;
				display: flex;
				flex-direction: column;
				min-height: 0;
				overflow: hidden;
			}

			#topbar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0.5rem 0.75rem;
				flex-shrink: 0;
				font-size: 0.8rem;
			}

			#whoami {
				color: #a6e3a1;
			}

			#logout {
				background: none;
				border: 1px solid #2a2a2a;
				border-radius: 0.3rem;
				color: #6c7086;
				font-size: 0.75rem;
				padding: 0.35rem 0.6rem;
				cursor: pointer;
			}

			/* ── Boards list ── */
			#boards-view {
				flex: 1;
				min-height: 0;
				display: flex;
				flex-direction: column;
				gap: 0.9rem;
				padding: 0.5rem 0.75rem 1rem;
			}

			#board-form {
				display: flex;
				gap: 0.5rem;
				width: 100%;
				max-width: 600px;
				margin: 0 auto;
			}

			#board-form .field {
				padding: 0.6rem 0.75rem;
			}

			#import-banner {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 0.5rem;
				width: 100%;
				max-width: 600px;
				margin: 0 auto;
				border: 1px solid #2a2a2a;
				border-radius: 0.4rem;
				padding: 0.6rem 0.75rem;
				font-size: 0.85rem;
				color: #cdd6f4;
			}

			#import-banner span {
				flex: 1;
			}

			.small-btn {
				background: none;
				border: 1px solid #2a2a2a;
				border-radius: 0.3rem;
				color: #89b4fa;
				font-size: 0.75rem;
				padding: 0.35rem 0.6rem;
				cursor: pointer;
			}

			.small-btn.muted {
				color: #6c7086;
			}

			#boards {
				list-style: none;
				width: 100%;
				max-width: 600px;
				margin: 0 auto;
				overflow-y: auto;
				flex: 1;
			}

			#boards li {
				margin-bottom: 0.5rem;
			}

			#boards .board-open {
				width: 100%;
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 0.75rem;
				background: #161616;
				border: 1px solid #2a2a2a;
				border-radius: 0.4rem;
				color: #cdd6f4;
				font-size: 1rem;
				padding: 0.85rem 0.9rem;
				cursor: pointer;
				text-align: left;
			}

			#boards .board-open:hover {
				border-color: #a6e3a1;
			}

			.board-role {
				color: #6c7086;
				font-size: 0.7rem;
				text-transform: uppercase;
				letter-spacing: 0.08em;
			}

			.empty {
				color: #6c7086;
				font-size: 0.9rem;
				text-align: center;
				padding: 1.5rem 0;
			}

			/* ── Board view ── */
			#board-view {
				flex: 1;
				min-height: 0;
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}

			#board-head {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				padding: 0.25rem 0.75rem 0.5rem;
				flex-shrink: 0;
			}

			#back {
				background: none;
				border: none;
				color: #6c7086;
				font-size: 1.1rem;
				cursor: pointer;
				padding: 0.25rem 0.4rem;
			}

			#board-title {
				flex: 1;
				color: #a6e3a1;
				font-size: 1.05rem;
				font-weight: 500;
				overflow-wrap: anywhere;
			}

			#task-form {
				display: flex;
				align-items: center;
				gap: 0.4rem;
				width: 100%;
				max-width: 640px;
				margin: 0 auto;
				flex-shrink: 0;
				padding: 0.25rem 0.5rem 0.75rem;
			}

			#task-input {
				flex: 1;
				min-width: 0;
				min-height: 44px;
				background: transparent;
				border: none;
				outline: none;
				font-size: 1.5rem;
				color: #cdd6f4;
				caret-color: #89b4fa;
				text-align: center;
				padding: 0.5rem 0.25rem;
			}

			#task-input::placeholder {
				color: #45475a;
			}

			#list-container {
				flex: 1;
				min-height: 0;
				overflow-y: auto;
				padding: 0.5rem;
				display: flex;
				flex-direction: column;
				align-items: center;
				-webkit-overflow-scrolling: touch;
				scroll-behavior: smooth;
			}

			#list,
			#done-list {
				list-style: none;
				width: 100%;
				max-width: 600px;
			}

			#list {
				color: #a6e3a1;
				font-size: var(--task-size, 1.1rem);
				line-height: 1.2;
			}

			#list li,
			#done-list li {
				position: relative;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
				padding: 0.3rem 1.6rem;
				text-align: center;
			}

			#list li .icon-btn,
			#done-list li .icon-btn {
				position: absolute;
				right: 0;
				top: 50%;
				transform: translateY(-50%);
			}

			#list li span,
			#done-list li span {
				overflow-wrap: anywhere;
			}

			#list li.highlight {
				color: #fffafa;
				border-radius: 0.4rem;
			}

			.icon-btn {
				background: none;
				border: none;
				color: #585b70;
				font-size: 0.9em;
				cursor: pointer;
				padding: 0.15rem 0.35rem;
				min-width: 28px;
				min-height: 28px;
				flex-shrink: 0;
			}

			.icon-btn:hover {
				color: #f38ba8;
			}

			#done-wrap {
				flex-shrink: 0;
				max-height: 28vh;
				overflow-y: auto;
				border-top: 1px solid #1c1c1c;
				padding: 0.4rem 0.75rem 0;
			}

			#done-wrap summary {
				color: #6c7086;
				font-size: 0.85rem;
				cursor: pointer;
				padding: 0.25rem 0;
			}

			#done-list {
				color: #585b70;
				font-size: 0.95rem;
				padding-bottom: 0.4rem;
			}

			#done-list li span {
				text-decoration: line-through;
			}

			#buttons-container {
				display: flex;
				justify-content: center;
				flex-shrink: 0;
				background: #0f0f0f;
				padding: 0.75rem 0.5rem calc(0.75rem + env(safe-area-inset-bottom));
			}

			#spin {
				min-height: 44px;
				min-width: 44px;
				padding: 0.5rem 1.5rem;
				font: inherit;
				border: 1px solid #a6e3a1;
				background: transparent;
				color: #a6e3a1;
				border-radius: 0.4rem;
				cursor: pointer;
			}

			#spin:hover:not(:disabled) {
				background: #a6e3a1;
				color: #0f0f0f;
			}

			#spin:disabled {
				opacity: 0.4;
				cursor: default;
			}

			#board-admin {
				display: flex;
				justify-content: center;
				gap: 0.5rem;
				padding-bottom: calc(0.5rem + env(safe-area-inset-bottom));
			}

			/* ── Members ── */
			#members-modal {
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.7);
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1rem;
				z-index: 150;
			}

			.modal-card {
				background: #161616;
				border: 1px solid #2a2a2a;
				border-radius: 0.6rem;
				width: 100%;
				max-width: 460px;
				max-height: 85dvh;
				overflow-y: auto;
				padding: 1rem;
				display: flex;
				flex-direction: column;
				gap: 0.8rem;
			}

			.modal-head {
				display: flex;
				align-items: center;
				justify-content: space-between;
			}

			.modal-head h3 {
				font-size: 1rem;
				font-weight: 500;
				color: #a6e3a1;
			}

			#members-close {
				background: none;
				border: none;
				color: #6c7086;
				font-size: 1.2rem;
				cursor: pointer;
				padding: 0.2rem 0.5rem;
			}

			.member-row {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				padding: 0.45rem 0;
				border-bottom: 1px solid #1c1c1c;
			}

			.member-name {
				flex: 1;
				color: #cdd6f4;
				overflow-wrap: anywhere;
			}

			.member-row select,
			.modal-card select {
				background: #0f0f0f;
				border: 1px solid #2a2a2a;
				border-radius: 0.3rem;
				color: #cdd6f4;
				font-family: inherit;
				font-size: 0.8rem;
				padding: 0.35rem;
			}

			.member-form {
				display: flex;
				gap: 0.4rem;
			}

			.member-form .field {
				font-size: 0.85rem;
				padding: 0.5rem;
			}

			.member-section-label {
				color: #6c7086;
				font-size: 0.7rem;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}

			#invite-result,
			#guest-result {
				display: flex;
				gap: 0.4rem;
			}

			#invite-result .field,
			#guest-result .field {
				font-size: 0.75rem;
				padding: 0.5rem;
			}

			#invite-url,
			#guest-url {
				flex: 1;
			}

			.invite-row {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 0.5rem;
				color: #585b70;
				font-size: 0.8rem;
				padding: 0.3rem 0;
			}

			#winner-screen {
				position: fixed;
				inset: 0;
				background: #000;
				display: flex;
				align-items: center;
				justify-content: center;
				color: #a6e3a1;
				font-size: 3rem;
				text-align: center;
				padding: 2rem;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.6s ease;
				z-index: 100;
			}

			#winner-screen.show {
				opacity: 1;
				pointer-events: auto;
			}

			#toast {
				position: fixed;
				left: 50%;
				bottom: calc(1rem + env(safe-area-inset-bottom));
				transform: translateX(-50%);
				max-width: 90vw;
				background: #1c1c1c;
				border: 1px solid #f38ba8;
				border-radius: 0.4rem;
				color: #f38ba8;
				font-size: 0.85rem;
				padding: 0.5rem 0.75rem;
				z-index: 200;
			}

			@media (min-width: 641px) {
				#task-input {
					font-size: 2rem;
				}
			}
		</style>
	</head>
	<body>
		<div id="winner-screen"></div>
		<div id="toast" hidden></div>

		<div id="boot">loading…</div>

		<section id="auth-screen" hidden>
			<h1>jusdoit</h1>
			<form id="auth-form">
				<input
					id="auth-username"
					class="field"
					type="text"
					name="username"
					placeholder="username"
					autocomplete="username"
					autocapitalize="none"
					spellcheck="false"
					required
				/>
				<input
					id="auth-password"
					class="field"
					type="password"
					name="password"
					placeholder="password"
					autocomplete="current-password"
					required
				/>
				<button id="auth-submit" class="primary" type="submit">log in</button>
			</form>
			<p id="auth-error" role="alert"></p>
			<button id="auth-toggle" type="button">no account? sign up</button>
		</section>

		<div id="app" hidden>
			<header id="topbar">
				<span id="whoami"></span>
				<button id="logout" type="button">log out</button>
			</header>

			<section id="boards-view" hidden>
				<form id="board-form">
					<input
						id="board-name"
						class="field"
						type="text"
						placeholder="new board"
						maxlength="60"
						autocomplete="off"
					/>
					<button class="primary" type="submit">create</button>
				</form>

				<div id="import-banner" hidden>
					<span id="import-text"></span>
					<button id="import-yes" class="small-btn" type="button">import</button>
					<button id="import-no" class="small-btn muted" type="button">dismiss</button>
				</div>

				<ul id="boards"></ul>
				<p id="boards-empty" class="empty" hidden>no boards yet — create one above</p>
			</section>

			<section id="board-view" hidden>
				<div id="board-head">
					<button id="back" type="button" aria-label="back">←</button>
					<h2 id="board-title"></h2>
					<button id="members-btn" class="small-btn muted" type="button">people</button>
				</div>

				<form id="task-form">
					<input
						id="task-input"
						type="text"
						placeholder="add a task"
						aria-label="new task"
						enterkeyhint="done"
						spellcheck="false"
						autocomplete="off"
						maxlength="500"
					/>
				</form>

				<div id="list-container">
					<ul id="list"></ul>
					<p id="list-empty" class="empty" hidden>spin something onto the list</p>
				</div>

				<div id="done-wrap" hidden>
					<details id="done-details">
						<summary id="done-summary">done</summary>
						<ul id="done-list"></ul>
					</details>
				</div>

				<div id="buttons-container">
					<button id="spin" type="button">spin</button>
				</div>

				<div id="board-admin" hidden>
					<button id="rename-board" class="small-btn muted" type="button">rename</button>
					<button id="delete-board" class="small-btn muted" type="button">delete board</button>
				</div>
			</section>

			<div id="members-modal" hidden>
				<div class="modal-card">
					<div class="modal-head">
						<h3>members</h3>
						<button id="members-close" type="button" aria-label="close">×</button>
					</div>

					<ul id="member-list"></ul>

					<div id="owner-tools" hidden>
						<p class="member-section-label">add by username</p>
						<form id="add-member-form" class="member-form">
							<input
								id="member-username"
								class="field"
								type="text"
								placeholder="username"
								autocomplete="off"
								autocapitalize="none"
								spellcheck="false"
							/>
							<select id="member-role">
								<option value="editor">editor</option>
								<option value="viewer">viewer</option>
							</select>
							<button class="primary" type="submit">add</button>
						</form>

						<p class="member-section-label">invite link (7 days)</p>
						<form id="invite-form" class="member-form">
							<select id="invite-role">
								<option value="editor">editor</option>
								<option value="viewer">viewer</option>
							</select>
							<button class="primary" type="submit">create link</button>
						</form>
						<div id="invite-result" hidden>
							<input id="invite-url" class="field" type="text" readonly />
							<button id="invite-copy" class="small-btn" type="button">copy</button>
						</div>
						<ul id="invite-list"></ul>

						<p class="member-section-label">guest link (no account)</p>
						<form id="guest-form" class="member-form">
							<select id="guest-role">
								<option value="editor">editor</option>
								<option value="viewer">viewer</option>
							</select>
							<button class="primary" type="submit">create guest link</button>
						</form>
						<div id="guest-result" hidden>
							<input id="guest-url" class="field" type="text" readonly />
							<button id="guest-copy" class="small-btn" type="button">copy</button>
						</div>
						<ul id="guest-link-list"></ul>
					</div>
				</div>
			</div>
		</div>

		<script>
			const $ = (id) => document.getElementById(id);

			const boot = $("boot");
			const authScreen = $("auth-screen");
			const authForm = $("auth-form");
			const authUsername = $("auth-username");
			const authPassword = $("auth-password");
			const authSubmit = $("auth-submit");
			const authToggle = $("auth-toggle");
			const authError = $("auth-error");
			const whoami = $("whoami");
			const logoutBtn = $("logout");
			const app = $("app");
			const toastEl = $("toast");

			const boardsView = $("boards-view");
			const boardForm = $("board-form");
			const boardName = $("board-name");
			const boardsList = $("boards");
			const boardsEmpty = $("boards-empty");
			const importBanner = $("import-banner");
			const importText = $("import-text");
			const importYes = $("import-yes");
			const importNo = $("import-no");

			const boardView = $("board-view");
			const boardTitle = $("board-title");
			const taskForm = $("task-form");
			const taskInput = $("task-input");
			const list = $("list");
			const listContainer = $("list-container");
			const listEmpty = $("list-empty");
			const doneWrap = $("done-wrap");
			const doneSummary = $("done-summary");
			const doneList = $("done-list");
			const spinBtn = $("spin");
			const boardAdmin = $("board-admin");
			const renameBtn = $("rename-board");
			const deleteBtn = $("delete-board");
			const winnerScreen = $("winner-screen");
			const buttonsContainer = $("buttons-container");

			const membersBtn = $("members-btn");
			const membersModal = $("members-modal");
			const membersClose = $("members-close");
			const memberList = $("member-list");
			const ownerTools = $("owner-tools");
			const addMemberForm = $("add-member-form");
			const memberUsername = $("member-username");
			const memberRoleSelect = $("member-role");
			const inviteForm = $("invite-form");
			const inviteRoleSelect = $("invite-role");
			const inviteResult = $("invite-result");
			const inviteURL = $("invite-url");
			const inviteCopy = $("invite-copy");
			const inviteList = $("invite-list");
			const guestForm = $("guest-form");
			const guestRoleSelect = $("guest-role");
			const guestResult = $("guest-result");
			const guestURL = $("guest-url");
			const guestCopy = $("guest-copy");
			const guestLinkList = $("guest-link-list");

			const isTouch = matchMedia("(hover: none) and (pointer: coarse)").matches;
			const state = {
				user: null,
				boards: [],
				board: null,
				active: [],
				done: [],
				members: [],
				invites: [],
				guestLinks: [],
			};
			let authMode = "login";
			let spinning = false;
			let toastTimer = 0;
			let pollTimer = 0;
			let polling = false;
			let boardsSig = "";
			let boardSig = "";

			function toast(msg) {
				toastEl.textContent = msg;
				toastEl.hidden = false;
				clearTimeout(toastTimer);
				toastTimer = setTimeout(() => (toastEl.hidden = true), 3000);
			}

			async function api(path, options = {}) {
				const res = await fetch(path, {
					headers: { "Content-Type": "application/json", ...(options.headers || {}) },
					...options,
				});
				let data = null;
				if (res.status !== 204) {
					data = await res.json().catch(() => null);
				}
				if (!res.ok) {
					const err = new Error((data && data.error) || `request failed (${res.status})`);
					err.status = res.status;
					throw err;
				}
				return data;
			}

			function handleError(err) {
				if (err.status === 401) {
					showAuth();
					return;
				}
				toast(err.message);
			}

			// ── Screens ──
			function showAuth() {
				stopPolling();
				state.user = null;
				state.board = null;
				membersModal.hidden = true;
				boot.hidden = true;
				app.hidden = true;
				authScreen.hidden = false;
				authError.textContent = "";
				authPassword.value = "";
				if (location.hash && !location.hash.startsWith("#/join/")) location.hash = "";
				if (!isTouch) authUsername.focus();
			}

			function showApp(user) {
				state.user = user;
				boot.hidden = true;
				authScreen.hidden = true;
				app.hidden = false;
				whoami.textContent = "@" + user.username;
				route();
				startPolling();
				const pending = sessionStorage.getItem("pending-join");
				if (pending && !location.hash.startsWith("#/join/")) acceptInvite(pending);
			}

			// ── Routing ──
			function route() {
				if (!state.user) return;
				const hash = location.hash || "#/";
				if (hash.startsWith("#/join/")) {
					acceptInvite(hash.slice("#/join/".length));
				} else if (hash.startsWith("#/g/")) {
					acceptGuest(hash.slice("#/g/".length));
				} else if (hash.startsWith("#/b/")) {
					openBoard(hash.slice(4));
				} else {
					showBoards();
				}
			}

			function navigate(hash) {
				if (location.hash === hash) route();
				else location.hash = hash;
			}

			window.addEventListener("hashchange", route);

			// ── Boards ──
			async function showBoards() {
				boardView.hidden = true;
				boardsView.hidden = false;
				membersModal.hidden = true;
				state.board = null;
				try {
					const data = await api("/api/boards");
					state.boards = data.boards || [];
					boardsSig = JSON.stringify(state.boards);
					renderBoards();
					maybeShowImport();
				} catch (err) {
					handleError(err);
				}
			}

			function renderBoards() {
				boardsList.innerHTML = "";
				boardsEmpty.hidden = state.boards.length > 0;

				for (const board of state.boards) {
					const li = document.createElement("li");
					const btn = document.createElement("button");
					btn.type = "button";
					btn.className = "board-open";

					const name = document.createElement("span");
					name.textContent = board.name;
					const role = document.createElement("span");
					role.className = "board-role";
					role.textContent = board.role;

					btn.append(name, role);
					btn.addEventListener("click", () => navigate(`#/b/${board.id}`));
					li.appendChild(btn);
					boardsList.appendChild(li);
				}
			}

			boardForm.addEventListener("submit", async (e) => {
				e.preventDefault();
				const name = boardName.value.trim();
				if (!name) return;
				try {
					const data = await api("/api/boards", {
						method: "POST",
						body: JSON.stringify({ name }),
					});
					boardName.value = "";
					navigate(`#/b/${data.board.id}`);
				} catch (err) {
					handleError(err);
				}
			});

			// ── Import from this browser ──
			function localTasks() {
				try {
					const parsed = JSON.parse(localStorage.getItem("tasks") || "[]");
					if (!Array.isArray(parsed)) return [];
					return parsed
						.map((t) => String(t).trim())
						.filter((t) => t.length > 0);
				} catch {
					return [];
				}
			}

			function maybeShowImport() {
				const tasks = localTasks();
				if (!tasks.length || localStorage.getItem("import-done")) return;
				const n = tasks.length;
				importText.textContent = `import ${n} saved task${n === 1 ? "" : "s"} from this browser?`;
				importBanner.hidden = false;
			}

			importYes.addEventListener("click", async () => {
				const tasks = localTasks();
				if (!tasks.length) {
					importBanner.hidden = true;
					return;
				}
				importYes.disabled = true;
				try {
					const created = await api("/api/boards", {
						method: "POST",
						body: JSON.stringify({ name: "imported" }),
					});
					// Local order is newest first; add oldest first so the order survives.
					for (const text of tasks.slice().reverse()) {
						await api(`/api/boards/${created.board.id}/tasks`, {
							method: "POST",
							body: JSON.stringify({ text }),
						});
					}
					localStorage.removeItem("tasks");
					localStorage.setItem("import-done", "1");
					importBanner.hidden = true;
					navigate(`#/b/${created.board.id}`);
				} catch (err) {
					handleError(err);
				} finally {
					importYes.disabled = false;
				}
			});

			importNo.addEventListener("click", () => {
				localStorage.setItem("import-done", "1");
				importBanner.hidden = true;
			});

			// ── Board ──
			async function openBoard(id) {
				membersModal.hidden = true;
				try {
					const data = await api(`/api/boards/${encodeURIComponent(id)}`);
					state.board = data.board;
					state.active = data.active || [];
					state.done = data.done || [];
					boardSig = JSON.stringify([data.board, data.active, data.done]);
					boardsView.hidden = true;
					boardView.hidden = false;
					renderBoard();
				} catch (err) {
					if (err.status === 404) {
						navigate("#/");
						toast("board not found");
						return;
					}
					handleError(err);
				}
			}

			function renderBoard() {
				const board = state.board;
				if (!board) return;
				const canEdit = board.role === "owner" || board.role === "editor";

				boardTitle.textContent = board.name;
				boardAdmin.hidden = board.role !== "owner";
				taskForm.hidden = !canEdit;
				buttonsContainer.hidden = !canEdit;
				doneWrap.hidden = state.done.length === 0;
				doneSummary.textContent = `done (${state.done.length})`;

				renderActive();
				renderDone();
				spinBtn.disabled = state.active.length === 0;
				requestAnimationFrame(fitList);
			}

			// Shrink the task type until the whole list fits on screen, then
			// fall back to scrolling when even the minimum is too much.
			function fitList() {
				if (boardView.hidden) return;
				const count = state.active.length;
				if (!count) {
					list.style.removeProperty("--task-size");
					return;
				}
				const available = listContainer.clientHeight - 8;
				if (available <= 0) return;

				let size = Math.floor((available / count - 10) / 1.2);
				size = Math.max(12, Math.min(24, size));
				list.style.setProperty("--task-size", size + "px");

				let guard = 0;
				while (
					size > 12 &&
					listContainer.scrollHeight > listContainer.clientHeight + 1 &&
					guard < 16
				) {
					size -= 1;
					list.style.setProperty("--task-size", size + "px");
					guard += 1;
				}
			}

			window.addEventListener("resize", () => requestAnimationFrame(fitList));
			window.addEventListener("orientationchange", () => setTimeout(fitList, 150));
			if (window.visualViewport) {
				window.visualViewport.addEventListener("resize", () => requestAnimationFrame(fitList));
			}

			function renderActive() {
				const canEdit = state.board && (state.board.role === "owner" || state.board.role === "editor");
				list.innerHTML = "";
				listEmpty.hidden = state.active.length > 0;

				for (const task of state.active) {
					const li = document.createElement("li");
					const text = document.createElement("span");
					text.textContent = task.text;
					li.appendChild(text);

					if (canEdit) {
						const del = document.createElement("button");
						del.type = "button";
						del.className = "icon-btn";
						del.title = "delete";
						del.setAttribute("aria-label", "delete task");
						del.textContent = "×";
						del.addEventListener("click", () => deleteTask(task.id));
						li.appendChild(del);
					}

					list.appendChild(li);
				}
			}

			function renderDone() {
				const canEdit = state.board && (state.board.role === "owner" || state.board.role === "editor");
				doneList.innerHTML = "";
				for (const task of state.done) {
					const li = document.createElement("li");
					const text = document.createElement("span");
					text.textContent = task.text;
					li.appendChild(text);

					if (canEdit) {
						const restore = document.createElement("button");
						restore.type = "button";
						restore.className = "icon-btn";
						restore.title = "restore";
						restore.setAttribute("aria-label", "restore task");
						restore.textContent = "↺";
						restore.addEventListener("click", () => restoreTask(task.id));
						li.appendChild(restore);
					}

					doneList.appendChild(li);
				}
			}

			async function deleteTask(taskId) {
				try {
					await api(`/api/boards/${state.board.id}/tasks/${taskId}`, { method: "DELETE" });
					state.active = state.active.filter((t) => t.id !== taskId);
					renderBoard();
				} catch (err) {
					handleError(err);
				}
			}

			async function restoreTask(taskId) {
				try {
					await api(`/api/boards/${state.board.id}/tasks/${taskId}/restore`, { method: "POST" });
					await refreshBoard();
				} catch (err) {
					handleError(err);
				}
			}

			async function refreshBoard() {
				if (!state.board) return;
				try {
					const data = await api(`/api/boards/${state.board.id}`);
					const sig = JSON.stringify([data.board, data.active, data.done]);
					if (sig === boardSig) return;
					boardSig = sig;
					state.board = data.board;
					state.active = data.active || [];
					state.done = data.done || [];
					renderBoard();
				} catch (err) {
					handleError(err);
				}
			}

			// ── Live sync ──
			// Boards and task lists are small, so a short poll keeps multiple
			// people in step without extra infrastructure. Rendering is skipped
			// when the payload is unchanged.
			function stopPolling() {
				clearInterval(pollTimer);
				pollTimer = 0;
			}

			function startPolling() {
				stopPolling();
				pollTimer = setInterval(poll, 3000);
			}

			async function refreshBoards() {
				if (!state.user) return;
				try {
					const data = await api("/api/boards");
					const sig = JSON.stringify(data.boards || []);
					if (sig === boardsSig) return;
					boardsSig = sig;
					state.boards = data.boards || [];
					renderBoards();
				} catch (err) {
					if (err.status !== 401) return;
					handleError(err);
				}
			}

			async function poll() {
				if (document.hidden || polling || !state.user) return;
				if (!boardView.hidden) {
					if (spinning || !state.board) return;
					polling = true;
					try {
						await refreshBoard();
					} finally {
						polling = false;
					}
				} else if (!boardsView.hidden) {
					await refreshBoards();
				}
			}

			document.addEventListener("visibilitychange", () => {
				if (!document.hidden && state.user) poll();
			});

			taskForm.addEventListener("submit", async (e) => {
				e.preventDefault();
				const text = taskInput.value.trim();
				if (!text || !state.board) return;
				try {
					const data = await api(`/api/boards/${state.board.id}/tasks`, {
						method: "POST",
						body: JSON.stringify({ text }),
					});
					state.active.unshift(data.task);
					taskInput.value = "";
					renderBoard();
				} catch (err) {
					handleError(err);
				}
			});

			$("back").addEventListener("click", () => navigate("#/"));

			renameBtn.addEventListener("click", async () => {
				if (!state.board) return;
				const name = prompt("board name", state.board.name);
				if (name === null) return;
				const trimmed = name.trim();
				if (!trimmed) return;
				try {
					const data = await api(`/api/boards/${state.board.id}`, {
						method: "PATCH",
						body: JSON.stringify({ name: trimmed }),
					});
					state.board = data.board;
					renderBoard();
				} catch (err) {
					handleError(err);
				}
			});

			deleteBtn.addEventListener("click", async () => {
				if (!state.board) return;
				if (!confirm(`delete "${state.board.name}" and all its tasks?`)) return;
				try {
					await api(`/api/boards/${state.board.id}`, { method: "DELETE" });
					navigate("#/");
				} catch (err) {
					handleError(err);
				}
			});

			// ── Members & invites ──
			function isOwner() {
				return state.board && state.board.role === "owner";
			}

			async function openMembers() {
				if (!state.board) return;
				ownerTools.hidden = !isOwner();
				inviteResult.hidden = true;
				guestResult.hidden = true;
				membersModal.hidden = false;
				await loadMembers();
			}

			function closeMembers() {
				membersModal.hidden = true;
			}

			async function loadMembers() {
				if (!state.board) return;
				try {
					const requests = [api(`/api/boards/${state.board.id}/members`)];
					if (isOwner()) {
						requests.push(api(`/api/boards/${state.board.id}/invites`));
						requests.push(api(`/api/boards/${state.board.id}/guest-links`));
					}
					const [memberData, inviteData, guestData] = await Promise.all(requests);
					state.members = memberData.members || [];
					state.invites = (inviteData && inviteData.invites) || [];
					state.guestLinks = (guestData && guestData.links) || [];
					renderMembers();
					renderInvites();
					renderGuestLinks();
				} catch (err) {
					handleError(err);
				}
			}

			function renderMembers() {
				memberList.innerHTML = "";
				const manage = isOwner();

				for (const member of state.members) {
					const li = document.createElement("li");
					li.className = "member-row";

					const name = document.createElement("span");
					name.className = "member-name";
					name.textContent = member.username + (member.user_id === state.user.id ? " (you)" : "");
					li.appendChild(name);

					if (manage && member.role !== "owner") {
						const select = document.createElement("select");
						for (const role of ["editor", "viewer"]) {
							const option = document.createElement("option");
							option.value = role;
							option.textContent = role;
							if (role === member.role) option.selected = true;
							select.appendChild(option);
						}
						select.addEventListener("change", () => setMemberRole(member.user_id, select.value));
						li.appendChild(select);

						const remove = document.createElement("button");
						remove.type = "button";
						remove.className = "icon-btn";
						remove.title = "remove";
						remove.setAttribute("aria-label", "remove member");
						remove.textContent = "×";
						remove.addEventListener("click", () => removeMember(member));
						li.appendChild(remove);
					} else {
						const role = document.createElement("span");
						role.className = "board-role";
						role.textContent = member.role;
						li.appendChild(role);
					}

					memberList.appendChild(li);
				}
			}

			function renderInvites() {
				inviteList.innerHTML = "";
				for (const invite of state.invites) {
					const li = document.createElement("li");
					li.className = "invite-row";

					const label = document.createElement("span");
					const expires = new Date(invite.expires_at);
					label.textContent = `${invite.role} · expires ${expires.toLocaleDateString()}`;

					const revoke = document.createElement("button");
					revoke.type = "button";
					revoke.className = "small-btn muted";
					revoke.textContent = "revoke";
					revoke.addEventListener("click", () => revokeInvite(invite.id));

					li.append(label, revoke);
					inviteList.appendChild(li);
				}
			}

			function renderGuestLinks() {
				guestLinkList.innerHTML = "";
				for (const link of state.guestLinks) {
					const li = document.createElement("li");
					li.className = "invite-row";

					const label = document.createElement("span");
					const created = new Date(link.created_at);
					label.textContent = `${link.role} · created ${created.toLocaleDateString()}`;

					const revoke = document.createElement("button");
					revoke.type = "button";
					revoke.className = "small-btn muted";
					revoke.textContent = "revoke";
					revoke.addEventListener("click", () => revokeGuestLink(link.id));

					li.append(label, revoke);
					guestLinkList.appendChild(li);
				}
			}

			async function setMemberRole(userId, role) {
				try {
					await api(`/api/boards/${state.board.id}/members/${userId}`, {
						method: "PATCH",
						body: JSON.stringify({ role }),
					});
					await loadMembers();
				} catch (err) {
					handleError(err);
					await loadMembers();
				}
			}

			async function removeMember(member) {
				if (!confirm(`remove ${member.username} from this board?`)) return;
				try {
					await api(`/api/boards/${state.board.id}/members/${member.user_id}`, { method: "DELETE" });
					await loadMembers();
				} catch (err) {
					handleError(err);
				}
			}

			async function revokeInvite(inviteId) {
				try {
					await api(`/api/boards/${state.board.id}/invites/${inviteId}`, { method: "DELETE" });
					await loadMembers();
				} catch (err) {
					handleError(err);
				}
			}

			async function revokeGuestLink(linkId) {
				if (!confirm("revoke this guest link? guests using it will be signed out.")) return;
				try {
					await api(`/api/boards/${state.board.id}/guest-links/${linkId}`, { method: "DELETE" });
					await loadMembers();
				} catch (err) {
					handleError(err);
				}
			}

			membersBtn.addEventListener("click", openMembers);
			membersClose.addEventListener("click", closeMembers);
			membersModal.addEventListener("click", (e) => {
				if (e.target === membersModal) closeMembers();
			});
			document.addEventListener("keydown", (e) => {
				if (e.key === "Escape" && !membersModal.hidden) closeMembers();
			});

			addMemberForm.addEventListener("submit", async (e) => {
				e.preventDefault();
				const username = memberUsername.value.trim();
				if (!username) return;
				try {
					await api(`/api/boards/${state.board.id}/members`, {
						method: "POST",
						body: JSON.stringify({ username, role: memberRoleSelect.value }),
					});
					memberUsername.value = "";
					toast(`added ${username}`);
					await loadMembers();
				} catch (err) {
					handleError(err);
				}
			});

			inviteForm.addEventListener("submit", async (e) => {
				e.preventDefault();
				try {
					const data = await api(`/api/boards/${state.board.id}/invites`, {
						method: "POST",
						body: JSON.stringify({ role: inviteRoleSelect.value }),
					});
					inviteURL.value = `${location.origin}/join/${data.token}`;
					inviteResult.hidden = false;
					inviteURL.select();
				} catch (err) {
					handleError(err);
				}
			});

			guestForm.addEventListener("submit", async (e) => {
				e.preventDefault();
				try {
					const data = await api(`/api/boards/${state.board.id}/guest-links`, {
						method: "POST",
						body: JSON.stringify({ role: guestRoleSelect.value }),
					});
					guestURL.value = `${location.origin}/g/${data.token}`;
					guestResult.hidden = false;
					guestURL.select();
					await loadMembers();
				} catch (err) {
					handleError(err);
				}
			});

			guestCopy.addEventListener("click", async () => {
				try {
					await navigator.clipboard.writeText(guestURL.value);
					toast("link copied");
				} catch {
					guestURL.select();
					document.execCommand("copy");
					toast("link copied");
				}
			});

			inviteCopy.addEventListener("click", async () => {
				try {
					await navigator.clipboard.writeText(inviteURL.value);
					toast("link copied");
				} catch {
					inviteURL.select();
					document.execCommand("copy");
					toast("link copied");
				}
			});

			// ── Join by invite ──
			async function acceptInvite(token) {
				sessionStorage.setItem("pending-join", token);
				try {
					const data = await api(`/api/invites/${encodeURIComponent(token)}/accept`, {
						method: "POST",
					});
					sessionStorage.removeItem("pending-join");
					toast(`joined as ${data.role}`);
					navigate(`#/b/${data.board_id}`);
				} catch (err) {
					if (err.status === 401) {
						handleError(err);
						return;
					}
					sessionStorage.removeItem("pending-join");
					if (err.status === 404) {
						toast("invite is invalid or expired");
						navigate("#/");
						return;
					}
					handleError(err);
				}
			}

			// ── Join as a guest ──
			async function acceptGuest(token) {
				try {
					const data = await api(`/api/guest/${encodeURIComponent(token)}`, { method: "POST" });
					sessionStorage.removeItem("pending-guest");
					toast(data.guest ? `joined as guest ${data.role}` : `joined as ${data.role}`);
					navigate(`#/b/${data.board_id}`);
				} catch (err) {
					sessionStorage.removeItem("pending-guest");
					if (err.status === 404) {
						toast("guest link is invalid");
						navigate("#/");
						return;
					}
					handleError(err);
				}
			}

			// ── Spin ──
			function animateTo(target) {
				return new Promise((resolve) => {
					if (!list.children.length) {
						resolve();
						return;
					}
					const size = list.children.length;
					const minTicks = size * 3;
					let index = 0;
					let speed = 50;
					let ticks = 0;

					function tick() {
						list.querySelector(".highlight")?.classList.remove("highlight");
						list.children[index % size]?.classList.add("highlight");

						if (ticks >= minTicks && index % size === target) {
							resolve();
							return;
						}
						if (ticks >= minTicks) speed += 40;

						index++;
						ticks++;
						setTimeout(tick, speed);
					}

					tick();
				});
			}

			function showWinner(text) {
				return new Promise((resolve) => {
					winnerScreen.textContent = text;
					winnerScreen.classList.add("show");
					winnerScreen.addEventListener(
						"click",
						() => {
							winnerScreen.classList.remove("show");
							resolve();
						},
						{ once: true },
					);
				});
			}

			spinBtn.addEventListener("click", async () => {
				if (spinning || !state.board || !state.active.length) return;
				spinning = true;
				spinBtn.disabled = true;

				try {
					const data = await api(`/api/boards/${state.board.id}/spin`, { method: "POST" });
					if (!data.task) {
						toast("nothing left to spin");
						await refreshBoard();
						return;
					}

					const winner = data.task;
					const index = state.active.findIndex((t) => t.id === winner.id);

					if (index >= 0) {
						await animateTo(index);
						const dismissed = showWinner(winner.text);
						refreshBoard();
						await dismissed;
					} else {
						await showWinner(winner.text);
						await refreshBoard();
					}
				} catch (err) {
					handleError(err);
				} finally {
					spinning = false;
					spinBtn.disabled = state.active.length === 0;
				}
			});

			// ── Auth ──
			authToggle.addEventListener("click", () => {
				authMode = authMode === "login" ? "register" : "login";
				authSubmit.textContent = authMode === "login" ? "log in" : "sign up";
				authToggle.textContent =
					authMode === "login" ? "no account? sign up" : "have an account? log in";
				authPassword.autocomplete =
					authMode === "login" ? "current-password" : "new-password";
				authError.textContent = "";
			});

			authForm.addEventListener("submit", async (e) => {
				e.preventDefault();
				authError.textContent = "";

				const username = authUsername.value.trim();
				const password = authPassword.value;
				if (!username || !password) {
					authError.textContent = "enter a username and password";
					return;
				}

				authSubmit.disabled = true;
				try {
					const data = await api(`/api/auth/${authMode}`, {
						method: "POST",
						body: JSON.stringify({ username, password }),
					});
					authPassword.value = "";
					authUsername.value = data.user.username;
					showApp(data.user);
				} catch (err) {
					authError.textContent = err.message;
				} finally {
					authSubmit.disabled = false;
				}
			});

			logoutBtn.addEventListener("click", async () => {
				try {
					await api("/api/auth/logout", { method: "POST" });
				} catch {
					/* ignore */
				}
				sessionStorage.removeItem("pending-join");
				showAuth();
			});

			// ── Keyboard / focus ──
			document.addEventListener("keydown", (e) => {
				if (boardView.hidden || taskForm.hidden) return;
				if (membersModal.hidden && e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
					if (document.activeElement !== taskInput) {
						taskInput.focus();
						taskInput.value += e.key;
						taskInput.dispatchEvent(new Event("input", { bubbles: true }));
						e.preventDefault();
					}
				}
			});

			if (!isTouch) {
				document.addEventListener("click", (e) => {
					if (boardView.hidden || taskForm.hidden) return;
					if (e.target.closest("button") || !membersModal.hidden) return;
					taskInput.focus();
				});
			}

			// Shared links are served by the SPA fallback; keep the token and
			// return the address bar to a clean hash route.
			(function () {
				let match = location.pathname.match(/^\/join\/([^/]+)\/?$/);
				if (match) {
					sessionStorage.setItem("pending-join", decodeURIComponent(match[1]));
					history.replaceState(null, "", "/");
					return;
				}
				match = location.pathname.match(/^\/g\/([^/]+)\/?$/);
				if (match) {
					sessionStorage.setItem("pending-guest", decodeURIComponent(match[1]));
					history.replaceState(null, "", "/");
				}
			})();

			// ── Bootstrap ──
			(async () => {
				const guestToken = sessionStorage.getItem("pending-guest");
				if (guestToken) await acceptGuest(guestToken);
				try {
					const data = await api("/api/auth/me");
					showApp(data.user);
				} catch {
					showAuth();
				}
			})();
		</script>
	</body>
</html>
