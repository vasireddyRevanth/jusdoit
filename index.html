<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#0f0f0f" />
		<title>list</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			[hidden] {
				display: none !important;
			}

			body {
				background: #0f0f0f;
				font-family: "Fira Code", monospace;
				min-height: 100dvh;
				overflow: hidden; /* prevent whole page scroll */
				display: flex;
				flex-direction: column;
				padding-top: env(safe-area-inset-top);
				padding-bottom: env(safe-area-inset-bottom);
				overscroll-behavior: none;
			}

			/* ── Boot ── */
			#boot {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
				color: #6c7086;
				font-size: 1rem;
			}

			/* ── Auth ── */
			#auth-screen {
				flex: 1;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				gap: 1.25rem;
				padding: 2rem 1rem;
				width: 100%;
				max-width: 360px;
				margin: 0 auto;
			}

			#auth-screen h1 {
				font-size: 2rem;
				font-weight: 500;
				color: #a6e3a1;
				letter-spacing: 0.04em;
			}

			#auth-form {
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
				width: 100%;
			}

			#auth-form input {
				background: #161616;
				border: 1px solid #2a2a2a;
				border-radius: 0.4rem;
				color: #cdd6f4;
				font: inherit;
				font-size: 1rem;
				padding: 0.75rem;
				outline: none;
			}

			#auth-form input:focus {
				border-color: #89b4fa;
			}

			#auth-form button {
				min-height: 44px;
				background: #a6e3a1;
				border: none;
				border-radius: 0.4rem;
				color: #0f0f0f;
				font: inherit;
				font-size: 1rem;
				font-weight: 600;
				cursor: pointer;
			}

			#auth-form button:disabled {
				opacity: 0.5;
				cursor: wait;
			}

			#auth-error {
				color: #f38ba8;
				font-size: 0.9rem;
				min-height: 1.2em;
				text-align: center;
			}

			#auth-toggle {
				background: none;
				border: none;
				color: #89b4fa;
				font: inherit;
				font-size: 0.9rem;
				cursor: pointer;
			}

			/* ── App ── */
			#app {
				flex: 1;
				display: flex;
				flex-direction: column;
				min-height: 0;
			}

			#topbar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0.5rem 0.75rem;
				flex-shrink: 0;
				font-size: 0.8rem;
			}

			#whoami {
				color: #a6e3a1;
			}

			#logout {
				background: none;
				border: 1px solid #2a2a2a;
				border-radius: 0.3rem;
				color: #6c7086;
				font: inherit;
				font-size: 0.75rem;
				padding: 0.35rem 0.6rem;
				cursor: pointer;
			}

			/* ── Sticky input at top ── */
			#form {
				position: sticky;
				top: 0;
				background: #0f0f0f;
				padding: 0.5rem 0.5rem 1rem;
				z-index: 10;
				display: flex;
				justify-content: center;
				flex-shrink: 0;
			}

			#input {
				background: transparent;
				border: none;
				outline: none;
				font-size: 1.5rem;
				color: #cdd6f4;
				caret-color: #89b4fa;
				text-align: center;
				width: 100%;
				max-width: 600px;
				padding: 0.5rem;
			}

			/* ── Scrollable list ── */
			#list-container {
				flex: 1;
				overflow-y: auto;
				padding: 1rem 0.5rem;
				display: flex;
				flex-direction: column;
				align-items: center;
				-webkit-overflow-scrolling: touch;
				scroll-behavior: smooth;
				min-height: 0;
			}

			#list {
				list-style: none;
				color: #a6e3a1;
				font-size: 1.1rem;
				text-align: center;
				width: 100%;
				max-width: 600px;
			}

			#list li {
				padding: 0.3rem 0;
			}

			#list li.highlight {
				color: #fffafa;
				border-radius: 0.4rem;
			}

			/* Desktop: larger type */
			@media (min-width: 641px) {
				#input {
					font-size: 2rem;
				}
				#list {
					font-size: 1.5rem;
				}
			}

			#winner-screen {
				position: fixed;
				inset: 0;
				background: #000;
				display: flex;
				align-items: center;
				justify-content: center;
				color: #a6e3a1;
				font-size: 3rem;
				text-align: center;
				padding: 2rem;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.6s ease;
				z-index: 100;
			}

			#winner-screen.show {
				opacity: 1;
				pointer-events: auto;
			}

			#buttons-container {
				display: flex;
				justify-content: center;
				padding: 1rem 0.5rem calc(1rem + env(safe-area-inset-bottom));
				flex-shrink: 0;
			}

			#ROLL_DA_THANG {
				min-height: 44px;
				min-width: 44px;
				padding: 0.5rem 1.5rem;
				font: inherit;
				border: 1px solid #a6e3a1;
				background: transparent;
				color: #a6e3a1;
				border-radius: 0.4rem;
				cursor: pointer;
			}

			#ROLL_DA_THANG:hover {
				background: #a6e3a1;
				color: #0f0f0f;
			}
		</style>
	</head>
	<body>
		<div id="winner-screen"></div>

		<div id="boot">loading…</div>

		<section id="auth-screen" hidden>
			<h1>jusdoit</h1>
			<form id="auth-form">
				<input
					id="auth-username"
					type="text"
					name="username"
					placeholder="username"
					autocomplete="username"
					autocapitalize="none"
					spellcheck="false"
					required
				/>
				<input
					id="auth-password"
					type="password"
					name="password"
					placeholder="password"
					autocomplete="current-password"
					required
				/>
				<button id="auth-submit" type="submit">log in</button>
			</form>
			<p id="auth-error" role="alert"></p>
			<button id="auth-toggle" type="button">no account? sign up</button>
		</section>

		<div id="app" hidden>
			<header id="topbar">
				<span id="whoami"></span>
				<button id="logout" type="button">log out</button>
			</header>

			<form id="form">
				<input id="input" type="text" spellcheck="false" autocomplete="off" />
			</form>

			<div id="list-container">
				<ul id="list"></ul>
			</div>

			<div id="buttons-container">
				<button id="ROLL_DA_THANG">spin</button>
			</div>
		</div>

		<script>
			const boot = document.getElementById("boot");
			const authScreen = document.getElementById("auth-screen");
			const app = document.getElementById("app");
			const authForm = document.getElementById("auth-form");
			const authUsername = document.getElementById("auth-username");
			const authPassword = document.getElementById("auth-password");
			const authSubmit = document.getElementById("auth-submit");
			const authToggle = document.getElementById("auth-toggle");
			const authError = document.getElementById("auth-error");
			const whoami = document.getElementById("whoami");
			const logoutBtn = document.getElementById("logout");

			const form = document.getElementById("form");
			const input = document.getElementById("input");
			const list = document.getElementById("list");
			const spin_btn = document.getElementById("ROLL_DA_THANG");
			const winnerScreen = document.getElementById("winner-screen");

			const isTouch = matchMedia("(hover: none) and (pointer: coarse)").matches;
			let authMode = "login";

			// ── API helper ──
			async function api(path, options = {}) {
				const res = await fetch(path, {
					headers: { "Content-Type": "application/json", ...(options.headers || {}) },
					...options,
				});
				let data = null;
				if (res.status !== 204) {
					data = await res.json().catch(() => null);
				}
				if (!res.ok) {
					throw new Error((data && data.error) || `request failed (${res.status})`);
				}
				return data;
			}

			// ── Screens ──
			function showAuth() {
				boot.hidden = true;
				app.hidden = true;
				authScreen.hidden = false;
				authError.textContent = "";
				authPassword.value = "";
				if (!isTouch) authUsername.focus();
			}

			function showApp(user) {
				boot.hidden = true;
				authScreen.hidden = true;
				app.hidden = false;
				whoami.textContent = "@" + user.username;
				renderTasks();
			}

			// ── Auth ──
			authToggle.addEventListener("click", () => {
				authMode = authMode === "login" ? "register" : "login";
				authSubmit.textContent = authMode === "login" ? "log in" : "sign up";
				authToggle.textContent =
					authMode === "login" ? "no account? sign up" : "have an account? log in";
				authPassword.autocomplete =
					authMode === "login" ? "current-password" : "new-password";
				authError.textContent = "";
			});

			authForm.addEventListener("submit", async (e) => {
				e.preventDefault();
				authError.textContent = "";

				const username = authUsername.value.trim();
				const password = authPassword.value;
				if (!username || !password) {
					authError.textContent = "enter a username and password";
					return;
				}

				authSubmit.disabled = true;
				try {
					const data = await api(`/api/auth/${authMode}`, {
						method: "POST",
						body: JSON.stringify({ username, password }),
					});
					showApp(data.user);
				} catch (err) {
					authError.textContent = err.message;
				} finally {
					authSubmit.disabled = false;
				}
			});

			logoutBtn.addEventListener("click", async () => {
				try {
					await api("/api/auth/logout", { method: "POST" });
				} catch {
					/* ignore */
				}
				showAuth();
			});

			// ── Type-anywhere capture (app only) ──
			document.addEventListener("keydown", (e) => {
				if (app.hidden) return;
				if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
					if (document.activeElement !== input) {
						input.focus();
						input.value += e.key;
						input.dispatchEvent(new Event("input", { bubbles: true }));
						e.preventDefault();
					}
				}
			});

			// Click anywhere → focus input (desktop only; on touch it would pop the keyboard)
			if (!isTouch) {
				document.addEventListener("click", () => {
					if (!app.hidden) input.focus();
				});
			}

			// ── Tasks (localStorage until boards land) ──
			let tasks = [];
			try {
				tasks = JSON.parse(localStorage.getItem("tasks")) || [];
				if (!Array.isArray(tasks)) tasks = [];
			} catch {
				tasks = [];
			}

			function saveTasks() {
				localStorage.setItem("tasks", JSON.stringify(tasks));
			}

			function renderTasks() {
				list.innerHTML = "";
				for (const t of tasks) {
					const li = document.createElement("li");
					li.textContent = t;
					list.appendChild(li);
				}
			}

			form.addEventListener("submit", (e) => {
				e.preventDefault();
				const text = input.value.trim();
				if (text) {
					tasks.unshift(text);
					saveTasks();
					renderTasks();
					input.value = "";
				}
			});

			function showWinner(task, onDismiss) {
				winnerScreen.textContent = task;
				winnerScreen.classList.add("show");

				winnerScreen.addEventListener("click", function hide() {
					winnerScreen.classList.remove("show");
					winnerScreen.removeEventListener("click", hide);
					onDismiss?.();
				});
			}

			spin_btn.addEventListener("click", () => {
				if (!tasks.length) return;

				const winnerIndex = Math.floor(Math.random() * tasks.length);
				let index = 0;
				let speed = 50;
				let ticks = 0;
				const minTicks =
					tasks.length * 3 + Math.floor(Math.random() * tasks.length);

				function tick() {
					list.querySelector(".highlight")?.classList.remove("highlight");
					list.children[index % tasks.length].classList.add("highlight");

					if (ticks >= minTicks) {
						if (index % tasks.length === winnerIndex) {
							const winner = tasks[winnerIndex];
							tasks.splice(winnerIndex, 1);
							saveTasks();
							showWinner(winner, renderTasks);
							return;
						}
						speed += 40;
					}

					setTimeout(tick, speed);
					index++;
					ticks++;
				}

				tick();
			});

			// ── Session bootstrap ──
			(async () => {
				try {
					const data = await api("/api/auth/me");
					showApp(data.user);
				} catch {
					showAuth();
				}
			})();
		</script>
	</body>
</html>
